name: VulnScan Source Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks and Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned scanners and verify release checksums
        env:
          GITLEAKS_VERSION: 8.30.1
          TRIVY_VERSION: 0.76.1
        run: |
          set -euo pipefail

          gitleaks_archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks_checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          trivy_archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          trivy_checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          mkdir -p "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/trivy"
          cd "$RUNNER_TEMP"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gitleaks_archive}" \
            --output "$RUNNER_TEMP/$gitleaks_archive"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gitleaks_checksums}" \
            --output "$RUNNER_TEMP/$gitleaks_checksums"
          awk -v asset="$gitleaks_archive" \
            '$2 == asset || $2 == "*" asset { print $1 "  " asset }' \
            "$RUNNER_TEMP/$gitleaks_checksums" | \
            sha256sum --check --status -
          tar -xzf "$RUNNER_TEMP/$gitleaks_archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"

          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${trivy_archive}" \
            --output "$RUNNER_TEMP/$trivy_archive"
          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${trivy_checksums}" \
            --output "$RUNNER_TEMP/$trivy_checksums"
          awk -v asset="$trivy_archive" \
            '$2 == asset || $2 == "*" asset { print $1 "  " asset }' \
            "$RUNNER_TEMP/$trivy_checksums" | \
            sha256sum --check --status -
          tar -xzf "$RUNNER_TEMP/$trivy_archive" -C "$RUNNER_TEMP/trivy" trivy
          chmod +x "$RUNNER_TEMP/trivy/trivy"

          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan source and Git history for secrets
        id: gitleaks
        continue-on-error: true
        run: >-
          gitleaks detect --source . --redact --report-format json
          --report-path gitleaks-report.json --exit-code 1

      - name: Scan dependencies for known vulnerabilities
        id: trivy
        continue-on-error: true
        run: >-
          trivy fs --scanners vuln --format json --output trivy-report.json
          --exit-code 1 --no-progress .

      - name: Remove secret-bearing fields from Gitleaks report
        id: redact_gitleaks
        if: always()
        run: |
          if [[ -f gitleaks-report.json ]]; then
            jq 'map(del(.Secret, .Match, .Message))' gitleaks-report.json > gitleaks-report.redacted.json
            mv gitleaks-report.redacted.json gitleaks-report.json
          else
            echo "No Gitleaks JSON report was generated."
          fi

      - name: Upload machine-readable security reports
        if: always() && steps.redact_gitleaks.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-security-reports
          path: |
            gitleaks-report.json
            trivy-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if either source scan failed
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          REDACT_GITLEAKS_OUTCOME: ${{ steps.redact_gitleaks.outcome }}
        run: |
          if [[ "$GITLEAKS_OUTCOME" != "success" || "$TRIVY_OUTCOME" != "success" || "$REDACT_GITLEAKS_OUTCOME" != "success" ]]; then
            echo "::error::Source security checks failed or reported findings. Review the redacted scanner output."
            exit 1
          fi
